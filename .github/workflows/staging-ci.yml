name: 🚀 Backend CI/CD

# ─────────────────────────────────────────────────────────────────
# BLOCKING TOGGLES — GitHub Settings → Variables
#
# Each job can be made non-blocking by setting its variable to 'false'.
# Default (variable absent or any other value) = blocking.
#
# Variable                    Default   Effect when set to 'false'
# ─────────────────────────────────────────────────────────────────
# SCAN_SECRETS_BLOCKING        true     Secret scan failures are ignored
# SCAN_CVE_BLOCKING            true     CVE scan failures are ignored
# TEST_ARCH_BLOCKING           true     Architecture test failures are ignored
# TEST_UNIT_BLOCKING           true     Unit test failures are ignored
# TEST_INTEGRATION_BLOCKING    true     Integration test failures are ignored
# QUALITY_SONAR_BLOCKING       true     Sonar quality gate failures are ignored
# BUILD_ARTIFACT_BLOCKING      true     Build failures are ignored
# PUSH_NEXUS_BLOCKING          true     Nexus publish failures are ignored
# BUILD_IMAGE_BLOCKING         true     Docker build failures are ignored
# SCAN_IMAGE_BLOCKING          true     Image scan failures are ignored
# PUSH_IMAGE_BLOCKING          true     Image push failures are ignored
# DEPLOY_STAGING_BLOCKING      true     Staging deploy failures are ignored
# ─────────────────────────────────────────────────────────────────
#
# ─────────────────────────────────────────────────────────────────
# DYNAMIC NAMING — build-ref
#
# All artifacts, reports, and image tags are prefixed with a
# canonical build reference computed once by the `setup` job:
#
#   {ARTIFACT_NAME}-{project.version}-{github.run_number}
#   e.g.  my-backend-1.4.2-87
#
# The `setup` job exposes two outputs consumed downstream:
#   needs.setup.outputs.build-ref   → full prefix for artifacts
#   needs.setup.outputs.version     → Maven version (semver Docker tag)
# ─────────────────────────────────────────────────────────────────
#
# ─────────────────────────────────────────────────────────────────
# ENVIRONMENT VARIABLES — single source of truth
#
# WORKING_DIR       Root of the Maven module and Dockerfile.
#                   Drives every target/ path and the Docker build
#                   context. Update once here to relocate the module.
#
# JAVA_DISTRIBUTION Temurin by default; swap for 'corretto', 'zulu',
#                   'microsoft', etc. without touching any job.
#
# ⚠ GitHub Actions does not allow env vars inside the `on.paths`
#   trigger or `defaults.run.working-directory`. If you rename
#   WORKING_DIR, update those two literal values manually:
#     on.push.paths      → "<WORKING_DIR>/**"
#     defaults.run.working-directory → <WORKING_DIR>
# ─────────────────────────────────────────────────────────────────

on:
  push:
    branches: [ "feature/staging-ci-cd" ]
    paths:
      - "backend/**"                          # ← mirror WORKING_DIR if changed
      - ".github/workflows/staging-ci.yml"
  pull_request:
    branches: [ "main", "release/**" ]
    paths:
      - "backend/**"                          # ← mirror WORKING_DIR if changed

defaults:
  run:
    working-directory: backend               # ← mirror WORKING_DIR if changed

env:
  JAVA_VERSION:      '17'
  JAVA_DISTRIBUTION: temurin
  WORKING_DIR:       .
  ARTIFACT_NAME:     my-backend
  NEXUS_URL:         https://nexus.example.com/repository/maven-releases
  REGISTRY:          registry.example.com
  IMAGE_NAME:        my-backend

# ─────────────────────────────────────────────
jobs:

  # ─── 0. SETUP ─────────────────────────────
  setup:
    name: "⚙️ Setup build reference"
    runs-on: ubuntu-latest
    outputs:
      build-ref: ${{ steps.ref.outputs.build-ref }}
      version:   ${{ steps.ref.outputs.version }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version:  ${{ env.JAVA_VERSION }}
          distribution:  ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: 🔖 Compute build reference
        id: ref
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout -f pom.xml)
          BUILD_REF="${{ env.ARTIFACT_NAME }}-${VERSION}-${{ github.run_number }}"
          echo "version=${VERSION}"     >> "$GITHUB_OUTPUT"
          echo "build-ref=${BUILD_REF}" >> "$GITHUB_OUTPUT"
          echo "✅ build-ref: ${BUILD_REF}"


  # ─── 1. SECRET SCAN ───────────────────────
  scan-secrets:
    name: "🔑 Secret scan"
    runs-on: ubuntu-latest
    needs: setup
    continue-on-error: ${{ vars.SCAN_SECRETS_BLOCKING == 'false' }}
    defaults:
      run:
        working-directory: .    # Gitleaks scans the entire repo, not just WORKING_DIR
    steps:
      - name: 📥 Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📥 Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz -C /tmp
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks

      - name: 🔍 Detect secrets
        run: gitleaks detect --source . --verbose


  # ─── 2. CVE SCAN ──────────────────────────
  scan-cve:
    name: "🛡️ CVE scan"
    runs-on: ubuntu-latest
    needs: [ setup, scan-secrets ]
    continue-on-error: ${{ vars.SCAN_CVE_BLOCKING == 'false' }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version:  ${{ env.JAVA_VERSION }}
          distribution:  ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: 🔎 Scan dependencies
        run: |
          mvn org.owasp:dependency-check-maven:check \
            -DfailBuildOnCVSS=7 \
            -DsuppressionFile=owasp-suppressions.xml

      - name: 📤 Upload OWASP report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ needs.setup.outputs.build-ref }}-owasp-report
          path: ${{ env.WORKING_DIR }}/target/dependency-check-report.html
          retention-days: 7


  # ─── 3. ARCHITECTURE TESTS ────────────────
  test-architecture:
    name: "🏛️ Architecture tests"
    runs-on: ubuntu-latest
    needs: [ setup, scan-cve ]
    continue-on-error: ${{ vars.TEST_ARCH_BLOCKING == 'false' }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version:  ${{ env.JAVA_VERSION }}
          distribution:  ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: 📐 Run architecture rules
        run: |
          mvn test \
            -Dtest="**/*ArchTest,**/*ArchitectureTest" \
            -DfailIfNoTests=false

      - name: 📤 Upload ArchUnit report
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.setup.outputs.build-ref }}-archunit
          path: ${{ env.WORKING_DIR }}/target/surefire-reports/
          retention-days: 1


  # ─── 4. UNIT TESTS ────────────────────────
  test-unit:
    name: "🧪 Unit tests"
    runs-on: ubuntu-latest
    needs: [ setup, test-architecture ]    # architecture must pass before unit tests
    continue-on-error: ${{ vars.TEST_UNIT_BLOCKING == 'false' }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version:  ${{ env.JAVA_VERSION }}
          distribution:  ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: 🧪 Run unit tests
        run: |
          mvn test \
            -Dtest="!**/*ArchTest,!**/*ArchitectureTest,!**/*IT,!**/*IntegrationTest" \
            -DfailIfNoTests=false

      - name: 📤 Upload unit test + JaCoCo reports
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.setup.outputs.build-ref }}-unit
          path: |
            ${{ env.WORKING_DIR }}/target/surefire-reports/
            ${{ env.WORKING_DIR }}/target/site/jacoco/jacoco.xml
          retention-days: 1


  # ─── 5. INTEGRATION TESTS ─────────────────
  test-integration:
    name: "🔗 Integration tests"
    runs-on: ubuntu-latest
    needs: [ setup, test-unit ]            # unit tests must pass before integration tests
    continue-on-error: ${{ vars.TEST_INTEGRATION_BLOCKING == 'false' }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version:  ${{ env.JAVA_VERSION }}
          distribution:  ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: 🔗 Run integration tests
        run: |
          mvn verify \
            -Dtest="**/*IT,**/*IntegrationTest" \
            -DfailIfNoTests=false

      - name: 📤 Upload integration test + JaCoCo reports
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.setup.outputs.build-ref }}-integration
          path: |
            ${{ env.WORKING_DIR }}/target/failsafe-reports/
            ${{ env.WORKING_DIR }}/target/site/jacoco-it/jacoco.xml
          retention-days: 1


  # ─── 6. SONAR QUALITY GATE ────────────────
  quality-sonar:
    name: "📊 Quality gate"
    runs-on: ubuntu-latest
    needs:
      - setup
      - test-architecture       # ArchUnit Surefire report
      - test-integration        # JaCoCo UT + IT reports (unit already implied via integration)
    continue-on-error: ${{ vars.QUALITY_SONAR_BLOCKING == 'false' }}
    steps:
      - name: 📥 Checkout (full history for blame)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version:  ${{ env.JAVA_VERSION }}
          distribution:  ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: 📥 Download ArchUnit report
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.setup.outputs.build-ref }}-archunit
          path: ${{ env.WORKING_DIR }}/target/surefire-reports/

      - name: 📥 Download unit test reports
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.setup.outputs.build-ref }}-unit
          path: ${{ env.WORKING_DIR }}/target/

      - name: 📥 Download integration test reports
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.setup.outputs.build-ref }}-integration
          path: ${{ env.WORKING_DIR }}/target/

      - name: 📊 Run Sonar analysis (no test re-run)
        env:
          SONAR_TOKEN:    ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          mvn sonar:sonar \
            -Dsonar.projectKey=${{ env.ARTIFACT_NAME }} \
            -Dsonar.coverage.jacoco.xmlReportPaths=\
              target/site/jacoco/jacoco.xml,\
              target/site/jacoco-it/jacoco.xml \
            -Dsonar.java.surefire.report=target/surefire-reports \
            -Dsonar.qualitygate.wait=true


  # ─── 7. BUILD ARTIFACT ────────────────────
  build-artifact:
    name: "📦 Build artifact"
    runs-on: ubuntu-latest
    needs: [ setup, quality-sonar ]
    continue-on-error: ${{ vars.BUILD_ARTIFACT_BLOCKING == 'false' }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version:  ${{ env.JAVA_VERSION }}
          distribution:  ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: 🔨 Build (tests already run)
        run: mvn package -DskipTests

      - name: 📤 Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.setup.outputs.build-ref }}-jar
          path: ${{ env.WORKING_DIR }}/target/*.jar
          retention-days: 1


  # ─── 8a. PUSH NEXUS ──────────────────────── ┐ parallel
  push-nexus:                                   # │
    name: "📤 Push Nexus"                       # │
    runs-on: ubuntu-latest                      # │
    needs: [ setup, build-artifact ]            # │
    continue-on-error: ${{ vars.PUSH_NEXUS_BLOCKING == 'false' }}
    steps:                                      # │
      - name: 📥 Checkout                       # │
        uses: actions/checkout@v4               # │
                                                # │
      - name: ☕ Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4             # │
        with:                                   # │
          java-version:  ${{ env.JAVA_VERSION }}   # │
          distribution:  ${{ env.JAVA_DISTRIBUTION }} # │
          cache: maven                          # │
          server-id: nexus                      # │
          server-username: NEXUS_USERNAME       # │
          server-password: NEXUS_PASSWORD       # │
                                                # │
      - name: 🚀 Publish to Nexus               # │
        env:                                    # │
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          mvn deploy -DskipTests \
            -DaltDeploymentRepository=nexus::${{ env.NEXUS_URL }}


  # ─── 8b. BUILD IMAGE ─────────────────────── ┘ parallel
  build-image:
    name: "🐳 Build Docker image"
    runs-on: ubuntu-latest
    needs: [ setup, build-artifact ]    # runs in parallel with push-nexus
    continue-on-error: ${{ vars.BUILD_IMAGE_BLOCKING == 'false' }}
    defaults:
      run:
        working-directory: .
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📥 Download JAR
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.setup.outputs.build-ref }}-jar
          path: ${{ env.WORKING_DIR }}/target/

      - name: 🏷️ Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.setup.outputs.build-ref }}
            type=sha,format=long
            type=ref,event=branch
            type=semver,pattern={{version}},value=${{ needs.setup.outputs.version }}

      - name: 🐳 Build image (no push)
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.WORKING_DIR }}   # Dockerfile lives in WORKING_DIR
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          outputs: type=docker,dest=/tmp/image.tar

      - name: 📤 Upload image tar
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.setup.outputs.build-ref }}-image
          path: /tmp/image.tar
          retention-days: 1


  # ─── 9. IMAGE SECURITY SCAN ───────────────
  scan-image:
    name: "🔬 Image security scan"
    runs-on: ubuntu-latest
    needs: [ setup, build-image ]
    continue-on-error: ${{ vars.SCAN_IMAGE_BLOCKING == 'false' }}
    defaults:
      run:
        working-directory: .    # Trivy runs outside WORKING_DIR
    steps:
      - name: 📥 Download image tar
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.setup.outputs.build-ref }}-image
          path: /tmp/

      - name: 🔬 Scan vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          input: /tmp/image.tar
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: 1

      - name: 📤 Upload results to Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif


  # ─── 10. PUSH IMAGE ───────────────────────
  push-image:
    name: "🚢 Push image to registry"
    runs-on: ubuntu-latest
    needs:
      - setup
      - scan-image              # ✅ image validated
      - push-nexus              # ✅ artifact in place
    continue-on-error: ${{ vars.PUSH_IMAGE_BLOCKING == 'false' }}
    defaults:
      run:
        working-directory: .
    steps:
      - name: 📥 Download image tar
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.setup.outputs.build-ref }}-image
          path: /tmp/

      - name: 🔐 Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: 🚢 Load and push
        run: |
          docker load -i /tmp/image.tar
          docker push --all-tags ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
